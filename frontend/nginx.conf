server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;  # manual refresh can take minutes on 125+ symbols
    }

    location / {
        try_files $uri /index.html;
    }
}
